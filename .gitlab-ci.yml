stages:
  - build
  - deploy

build_site:
  stage: build
  script:
    - echo "Building static site..."
    - mkdir public
    - cp site/index.html public/
    - cp site/telecharger.html public/
    - cp site/search.js public/       # Copy the .js script
    - cp -r site/data public/         # Copy site/data first
    - cp -r data/* public/data/       # Then overlay root data (merges directories)
    - cp -r downloads public/
    - cp "docs/technical_details.pdf" public/
    - sed -i 's|src="../data/|src="data/|g' public/index.html
    - sed -i 's|src="../docs/technical_details.pdf"|src="technical_details.pdf"|g' public/index.html
    - sed -i 's|href="../docs/technical_details.pdf"|href="technical_details.pdf"|g' public/index.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

pages:
  stage: deploy
  needs: [build_site]
  script:
    - echo "Deploying to GitLab Pages..."
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy_cliscan:
  stage: deploy
  image: ubuntu:22.04
  needs: [build_site]
  before_script:
    - apt-get update -qq && apt-get install -qq -y rsync openssh-client
    - mkdir -p ~/.ssh
    - >
      if [ -f "$SSH_KNOWN_HOSTS" ]; then
        cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
      else
        echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      fi
    - echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
  script:
    - echo "Deploying public/ to ${DEPLOY_USER}@${DEPLOY_HOST}:${SSH_PORT:-22}..."
    - rsync -az --no-perms --no-owner --no-group --delete --omit-dir-times -e "ssh -i ~/.ssh/id_rsa -p ${SSH_PORT:-22}" public/ ${DEPLOY_USER}@${DEPLOY_HOST}:/srv/www/
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
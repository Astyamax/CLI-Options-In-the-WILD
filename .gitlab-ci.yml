pages:
  stage: deploy
  script:
    - echo "Création du site statique en respectant l'architecture..."
    - mkdir public
    - cp site/index.html public/
    - cp site/telecharger.html public/
    - cp -r data public/
    - cp -r downloads public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
<svg width="1680" height="572" viewBox="0 0 1680 572" xmlns="http://www.w3.org/2000/svg"
     font-family="'DejaVu Sans','Liberation Sans',sans-serif" role="img"
     aria-label="compteur pipeline diagram with ls example">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#103049"/>
      <stop offset="1" stop-color="#0a1a28"/>
    </linearGradient>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2336"/>
      <stop offset="1" stop-color="#0a1a28"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#16384e" flood-opacity="0.16"/>
    </filter>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="7.5" refY="5" orient="auto">
      <path d="M0.5 1 L7.5 5 L0.5 9" fill="none" stroke="#9fb3c2"
            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1680" height="572" fill="#ffffff"/>

  <!-- ===================== HEADER : compteur ===================== -->
  <g transform="translate(24,16) scale(0.156)">
    <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#tile)"/>
    <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="#2bb3e3" stroke-width="10" stroke-opacity="0.9"/>
    <path d="M150 168 L214 256 L150 344" fill="none" stroke="#2bb3e3" stroke-width="34"
          stroke-linecap="round" stroke-linejoin="round"/>
    <g stroke-linecap="round">
      <line x1="252" y1="192" x2="284" y2="192" stroke="#f3722c" stroke-width="26"/>
      <line x1="300" y1="192" x2="392" y2="192" stroke="#e6f3fb" stroke-width="26"/>
      <line x1="252" y1="256" x2="284" y2="256" stroke="#f3722c" stroke-width="26"/>
      <line x1="300" y1="256" x2="368" y2="256" stroke="#cfe6f4" stroke-width="26"/>
      <line x1="252" y1="320" x2="284" y2="320" stroke="#f3722c" stroke-width="26"/>
      <line x1="300" y1="320" x2="344" y2="320" stroke="#a9cfe4" stroke-width="26"/>
    </g>
  </g>
  <text x="116" y="54" font-size="40" font-weight="700" fill="#103049"
        font-family="'DejaVu Sans Mono','Liberation Mono',monospace" letter-spacing="-1">compteur</text>
  <rect x="350" y="26" width="14" height="34" rx="3" fill="#f3722c"/>
  <text x="118" y="84" font-size="19" font-weight="600" fill="#6b7c8c"
        letter-spacing="2">automated CLI option extraction &amp; counting pipeline</text>

  <g transform="translate(0,24)">
  <!-- ===================== SECTION 1 LABEL ===================== -->
  <text x="24" y="128" font-size="16" font-weight="700" fill="#8aa0b2" letter-spacing="3">SETUP  &amp;  PROCESSING</text>

  <!-- ===================== ROW 1 CARDS : 1..5 (flow ->) ===================== -->
  <!-- card 1 : Clone -->
  <g>
    <rect x="24" y="140" width="290" height="100" rx="16" fill="#eef4f9" stroke="#d7e3ee" filter="url(#sh)"/>
    <rect x="24" y="152" width="7" height="76" rx="3.5" fill="#2bb3e3"/>
    <circle cx="58" cy="168" r="15" fill="#2bb3e3"/>
    <text x="58" y="173" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <!-- branch icon -->
    <g stroke="#2bb3e3" stroke-width="3" fill="none" stroke-linecap="round">
      <line x1="270" y1="163" x2="270" y2="181"/>
      <circle cx="270" cy="161" r="4" fill="#2bb3e3" stroke="none"/>
      <circle cx="270" cy="183" r="4" fill="#2bb3e3" stroke="none"/>
      <circle cx="288" cy="161" r="4" fill="#2bb3e3" stroke="none"/>
      <path d="M270 172 C270 164, 288 168, 288 163"/>
    </g>
    <text x="48" y="210" font-size="26" font-weight="700" fill="#16384e">Clone</text>
    <text x="48" y="231" font-size="17" fill="#6b7c8c">git repository</text>
  </g>
  <!-- card 2 : Setup -->
  <g>
    <rect x="359" y="140" width="290" height="100" rx="16" fill="#eef4f9" stroke="#d7e3ee" filter="url(#sh)"/>
    <rect x="359" y="152" width="7" height="76" rx="3.5" fill="#2bb3e3"/>
    <circle cx="393" cy="168" r="15" fill="#2bb3e3"/>
    <text x="393" y="173" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <!-- gear icon -->
    <g stroke="#2bb3e3" stroke-width="3" fill="none" stroke-linecap="round">
      <circle cx="605" cy="172" r="8"/>
      <line x1="605" y1="158" x2="605" y2="162"/>
      <line x1="605" y1="182" x2="605" y2="186"/>
      <line x1="591" y1="172" x2="595" y2="172"/>
      <line x1="615" y1="172" x2="619" y2="172"/>
      <circle cx="605" cy="172" r="2.5" fill="#2bb3e3" stroke="none"/>
    </g>
    <text x="383" y="210" font-size="26" font-weight="700" fill="#16384e">Setup</text>
    <text x="383" y="231" font-size="17" fill="#6b7c8c">dependencies, env</text>
  </g>
  <!-- card 3 : Versions (special case : different background) -->
  <g>
    <rect x="694" y="140" width="290" height="100" rx="16" fill="#e7f6f1" stroke="#b9e2d6" filter="url(#sh)"/>
    <rect x="694" y="152" width="7" height="76" rx="3.5" fill="#2bb39a"/>
    <circle cx="728" cy="168" r="15" fill="#2bb39a"/>
    <text x="728" y="173" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <!-- tag icon -->
    <g stroke="#2bb39a" stroke-width="3" fill="none" stroke-linejoin="round">
      <path d="M931 164 H944 L953 172 L944 180 H931 Z"/>
      <circle cx="937" cy="172" r="2.2" fill="#2bb39a" stroke="none"/>
    </g>
    <text x="718" y="210" font-size="26" font-weight="700" fill="#16384e">Versions</text>
    <text x="718" y="231" font-size="17" fill="#6b7c8c">every release tag</text>
  </g>
  <!-- card 4 : Extraction (compteur core) -->
  <g>
    <rect x="1029" y="140" width="290" height="100" rx="16" fill="#e2f1fb" stroke="#a9d4ec" stroke-width="1.6" filter="url(#sh)"/>
    <rect x="1029" y="152" width="7" height="76" rx="3.5" fill="#1fb6c9"/>
    <circle cx="1063" cy="168" r="15" fill="#1fb6c9"/>
    <text x="1063" y="173" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <!-- terminal >_ icon -->
    <g stroke="#1fb6c9" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1257 165 L1265 172 L1257 179"/>
      <line x1="1268" y1="180" x2="1277" y2="180"/>
    </g>
    <text x="1053" y="210" font-size="26" font-weight="700" fill="#16384e">Extraction</text>
    <text x="1053" y="231" font-size="17" fill="#6b7c8c">run help flag</text>
  </g>
  <!-- card 5 : Counting (compteur core) -->
  <g>
    <rect x="1364" y="140" width="290" height="100" rx="16" fill="#e2f1fb" stroke="#a9d4ec" stroke-width="1.6" filter="url(#sh)"/>
    <rect x="1364" y="152" width="7" height="76" rx="3.5" fill="#5a6fe0"/>
    <circle cx="1398" cy="168" r="15" fill="#5a6fe0"/>
    <text x="1398" y="173" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <!-- magnifier icon -->
    <g stroke="#5a6fe0" stroke-width="3" fill="none" stroke-linecap="round">
      <circle cx="1587" cy="170" r="7"/>
      <line x1="1592" y1="175" x2="1600" y2="183"/>
    </g>
    <text x="1388" y="210" font-size="26" font-weight="700" fill="#16384e">Counting</text>
    <text x="1388" y="231" font-size="17" fill="#6b7c8c">unique options, regex</text>
  </g>

  <!-- row 1 arrows (flow ->) -->
  <line x1="318" y1="188" x2="355" y2="188" stroke="#9fb3c2" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="653" y1="188" x2="690" y2="188" stroke="#9fb3c2" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="988" y1="188" x2="1025" y2="188" stroke="#9fb3c2" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="1323" y1="188" x2="1360" y2="188" stroke="#9fb3c2" stroke-width="3" marker-end="url(#arr)"/>

  <!-- snake down : Counting (5) -> example -->
  <line x1="1509" y1="240" x2="1509" y2="296" stroke="#9fb3c2" stroke-width="3" marker-end="url(#arr)"/>

  <!-- ===================== ROW 2 : example + outputs (flow <-) ===================== -->
  <!-- section labels -->
  <text x="954" y="290" font-size="16" font-weight="700" fill="#8aa0b2" letter-spacing="3">IN ACTION  ·  EXAMPLE : ls</text>
  <text x="284" y="350" font-size="16" font-weight="700" fill="#8aa0b2" letter-spacing="3">OUTPUTS</text>

  <!-- the example : live run terminal (between Counting and CSV) -->
  <rect x="954" y="300" width="700" height="220" rx="18" fill="url(#term)" stroke="#2bb3e3" stroke-width="2.5" stroke-opacity="0.85"/>
  <circle cx="984" cy="326" r="6" fill="#f3722c"/>
  <circle cx="1006" cy="326" r="6" fill="#e6c34a"/>
  <circle cx="1028" cy="326" r="6" fill="#38d9a9"/>
  <text x="1052" y="332" font-size="16" fill="#7fb8d6"
        font-family="'DejaVu Sans Mono','Liberation Mono',monospace">compteur  ·  live run : ls (GNU coreutils)</text>
  <line x1="970" y1="346" x2="1638" y2="346" stroke="#23435a" stroke-width="1.5"/>

  <g font-family="'DejaVu Sans Mono','Liberation Mono',monospace" font-size="18">
    <!-- note: build/setup handled separately -->
    <text x="982" y="376" font-size="15" fill="#6f93ab" xml:space="preserve"># clone &amp; build handled separately  ·  compteur takes the ready binary</text>
    <!-- prompt -->
    <text x="982" y="410" xml:space="preserve"><tspan fill="#38d9a9">$</tspan><tspan fill="#e6f3fb"> compteur ls</tspan></text>
    <!-- what compteur actually does: read help flags, extract option tokens, keep each option once, count -->
    <text x="982" y="442" xml:space="preserve"><tspan fill="#2bb3e3">▸</tspan><tspan fill="#cfe6f4"> read help    </tspan><tspan fill="#9fd8f0">--help · -h · --usage · -?</tspan><tspan fill="#cfe6f4">   </tspan><tspan fill="#38d9a9">✓</tspan></text>
    <text x="982" y="474" xml:space="preserve"><tspan fill="#2bb3e3">▸</tspan><tspan fill="#cfe6f4"> extract   option names </tspan><tspan fill="#9fd8f0">-x · --xxx</tspan><tspan fill="#cfe6f4">   keep each option once</tspan></text>
    <!-- result: count only -->
    <text x="982" y="508" xml:space="preserve"><tspan fill="#38d9a9">✓</tspan><tspan fill="#f3722c" font-weight="700"> 99 options</tspan><tspan fill="#e6f3fb">      </tspan><tspan fill="#9fd8f0">csv/coreutils_ls.csv</tspan></text>
  </g>

  <!-- card 6 : CSV (after the example) -->
  <g>
    <rect x="619" y="362" width="290" height="100" rx="16" fill="#eef4f9" stroke="#d7e3ee" filter="url(#sh)"/>
    <rect x="619" y="374" width="7" height="76" rx="3.5" fill="#8a5cd6"/>
    <circle cx="653" cy="390" r="15" fill="#8a5cd6"/>
    <text x="653" y="395" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
    <!-- table icon -->
    <g stroke="#8a5cd6" stroke-width="2.6" fill="none">
      <rect x="833" y="385" width="34" height="18" rx="2"/>
      <line x1="844" y1="385" x2="844" y2="403"/>
      <line x1="856" y1="385" x2="856" y2="403"/>
      <line x1="833" y1="394" x2="867" y2="394"/>
    </g>
    <text x="643" y="432" font-size="26" font-weight="700" fill="#16384e">CSV</text>
    <text x="643" y="453" font-size="17" fill="#6b7c8c">simple output, csv</text>
  </g>
  <!-- card 7 : Visualization (leftmost) -->
  <g>
    <rect x="284" y="362" width="290" height="100" rx="16" fill="#eef4f9" stroke="#d7e3ee" filter="url(#sh)"/>
    <rect x="284" y="374" width="7" height="76" rx="3.5" fill="#f3722c"/>
    <circle cx="318" cy="390" r="15" fill="#f3722c"/>
    <text x="318" y="395" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
    <!-- bar chart icon -->
    <g fill="#f3722c">
      <rect x="509" y="396" width="6" height="8" rx="1.5"/>
      <rect x="519" y="390" width="6" height="14" rx="1.5"/>
      <rect x="529" y="384" width="6" height="20" rx="1.5"/>
    </g>
    <text x="308" y="432" font-size="26" font-weight="700" fill="#16384e">Visualization</text>
    <text x="308" y="453" font-size="17" fill="#6b7c8c">charts &amp; trends</text>
  </g>

  <!-- row 2 arrows (flow <- : example -> CSV -> Visualization) -->
  <line x1="950" y1="410" x2="913" y2="410" stroke="#9fb3c2" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="615" y1="410" x2="578" y2="410" stroke="#9fb3c2" stroke-width="3" marker-end="url(#arr)"/>
  </g>
</svg>
